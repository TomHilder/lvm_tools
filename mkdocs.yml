site_name: lvm_tools
site_description: Lazy reading and preparation of SDSS-V LVM data for model fitting
repo_url: https://github.com/TomHilder/lvm_tools
repo_name: TomHilder/lvm_tools

theme:
  name: material
  palette:
    # Dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - user_guide/installation.md
    - user_guide/quickstart.md
    - user_guide/concepts.md
  - Tutorials:
    - tutorials/loading_data.md
    - tutorials/exploring_data.md
    - tutorials/data_configuration.md
    - tutorials/fitting_workflow.md
  - API Reference:
    - api/overview.md
    - api/tile.md
    - api/config.md
    - api/fit_data.md
    - api/processing.md
    - api/utils.md
  - Development:
    - changelog.md
    - contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: google
