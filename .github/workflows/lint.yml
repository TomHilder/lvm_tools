name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Same ruff version as uv.lock (bump both together)
      - name: Ruff lint
        run: uvx ruff@0.17.3 check .

      - name: Ruff format
        run: uvx ruff@0.17.3 format --check .
